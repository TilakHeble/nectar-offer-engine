name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,ml,serve]"
      - run: ruff check src tests
      - name: dbt parse (compiles every model and test without data)
        run: cd dbt && dbt parse --profiles-dir .
        env:
          NECTAR_WAREHOUSE: /tmp/ci.duckdb
      # Data tests skip automatically when the warehouse has not been built (raw data is not committed).
      - run: pytest -q

  docker:
    # Builds the real serving image, then runs it against a synthetic bundle built inside the
    # same image (so library versions match exactly) and calls every endpoint.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nectar-offer-api:ci .
      - name: Build a demo bundle inside the image
        run: |
          mkdir -p demo && chmod 777 demo
          docker run --rm -v "$PWD/demo:/out" --entrypoint python nectar-offer-api:ci \
            -m nectar.serving.demo_bundle /out/artifacts
      - name: Start the API container
        run: |
          docker run -d --name api -p 8000:8000 \
            -v "$PWD/demo/artifacts:/app/artifacts:ro" nectar-offer-api:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8000/ready && exit 0
            sleep 2
          done
          exit 1
      - name: Smoke test every endpoint
        run: docker exec api python -m nectar.serving.smoke --url http://localhost:8000
      - name: Container health check
        run: |
          for i in $(seq 1 20); do
            s=$(docker inspect --format '{{.State.Health.Status}}' api)
            echo "health: $s"
            [ "$s" = "healthy" ] && exit 0
            sleep 3
          done
          exit 1
      - name: Image size
        run: docker images nectar-offer-api:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Container logs
        if: always()
        run: docker logs api || true
