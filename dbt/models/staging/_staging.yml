version: 2

models:
  - name: stg_transactions
    description: One row per basket line, money columns sign-corrected, with an is_grocery flag.
    columns:
      - name: basket_id
        data_tests: [not_null]
      - name: member_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: is_grocery
        data_tests: [not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: brand_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["National", "Private"]

  - name: stg_households
    columns:
      - name: member_id
        data_tests: [unique, not_null]

  - name: stg_campaigns
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: campaign_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["TypeA", "TypeB", "TypeC"]

  - name: stg_campaign_members
    data_tests:
      - unique_combination:
          arguments:
            columns: [member_id, campaign_id]
    columns:
      - name: campaign_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id

  - name: stg_coupons
    columns:
      - name: campaign_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id

  - name: stg_coupon_redemptions
    columns:
      - name: member_id
        data_tests: [not_null]
      - name: campaign_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id
