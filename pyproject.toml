[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nectar-offer-engine"
version = "2.0.0"
description = "Uplift-based personalised offer engine for a Nectar-style loyalty programme"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5", "pre-commit", "jupyter", "nbconvert", "ipywidgets", "dbt-duckdb>=1.9"]
ml = ["lightgbm>=4.0", "econml>=0.15", "mlflow>=2.10", "pandera>=0.20", "joblib", "pulp>=2.8,<3"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2", "httpx"]
dashboard = ["streamlit>=1.40", "altair>=5"]
orchestrate = ["prefect>=3.9"]  # older Prefect fails to import with recent FastAPI (Body min_items)

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/nectar/monitoring/drift.py" = ["E501"]  # inline HTML/CSS report template

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
